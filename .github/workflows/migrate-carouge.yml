name: Migrate Carouge data

# Manual workflow only — never runs automatically. Use this once to
# copy the Carouge dataset (team_id = 'ecfc-juniors') from the old
# Supabase project to the new one.
#
# Setup before running, in the GitHub repo:
#   Settings → Secrets and variables → Actions → New repository secret
#     OLD_URL          = https://OLDREF.supabase.co
#     OLD_SERVICE_KEY  = eyJ... (service_role of the OLD project)
#     NEW_URL          = https://NEWREF.supabase.co
#     NEW_SERVICE_KEY  = eyJ... (service_role of the NEW project)
#
# After the workflow succeeds, delete those secrets.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install only the migration's own dependencies (just
      # @supabase/supabase-js). The app's package.json / lockfile is
      # never touched, so a desync there can't break the migration.
      - name: Install migration deps
        working-directory: scripts
        run: npm install --no-audit --no-fund --silent

      - name: Run migration
        working-directory: scripts
        env:
          OLD_URL: ${{ secrets.OLD_URL }}
          OLD_SERVICE_KEY: ${{ secrets.OLD_SERVICE_KEY }}
          NEW_URL: ${{ secrets.NEW_URL }}
          NEW_SERVICE_KEY: ${{ secrets.NEW_SERVICE_KEY }}
        run: node migrate-carouge.mjs
