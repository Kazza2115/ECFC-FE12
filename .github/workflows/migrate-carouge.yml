name: Migrate Carouge data

# Manual workflow only — never runs automatically. Use this once to
# copy the Carouge dataset (team_id = 'ecfc-juniors') from the old
# Supabase project to the new one.
#
# Setup before running, in the GitHub repo:
#   Settings → Secrets and variables → Actions → New repository secret
#     OLD_URL          = https://OLDREF.supabase.co
#     OLD_SERVICE_KEY  = eyJ... (service_role of the OLD project)
#     NEW_URL          = https://NEWREF.supabase.co
#     NEW_SERVICE_KEY  = eyJ... (service_role of the NEW project)
#
# After the workflow succeeds, delete those secrets — you don't need
# them anymore. Then rotate the service_role of any project you keep.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run migration
        env:
          OLD_URL: ${{ secrets.OLD_URL }}
          OLD_SERVICE_KEY: ${{ secrets.OLD_SERVICE_KEY }}
          NEW_URL: ${{ secrets.NEW_URL }}
          NEW_SERVICE_KEY: ${{ secrets.NEW_SERVICE_KEY }}
        run: node scripts/migrate-carouge.mjs
